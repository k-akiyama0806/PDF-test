<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>④ PDF.js ビューワー UI</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; display: flex; flex-direction: column; height: 100dvh; font-family: sans-serif; background: #404040; }

    #toolbar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 8px 12px; background: #3a3a3a; color: #fff;
      border-bottom: 1px solid #222; flex-shrink: 0;
    }
    #toolbar a { display: none; }
    #pageInfo { font-size: 0.9rem; min-width: 80px; text-align: center; }
    #zoomSelect {
      background: #555; border: none; color: #fff; padding: 6px 8px;
      border-radius: 4px; cursor: pointer; font-size: 0.9rem;
    }
    #status { font-size: 0.85rem; color: #aaa; }

    #viewerContainer { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 12px; }
    canvas { max-width: 100%; box-shadow: 0 2px 8px rgba(0,0,0,0.5); background: #fff; }
  </style>
</head>
<body>
  <div id="toolbar">
    <span id="pageInfo">- / -</span>
    <select id="zoomSelect">
      <option value="0.5">50%</option>
      <option value="0.75">75%</option>
      <option value="1" selected>100%</option>
      <option value="1.5">150%</option>
      <option value="2">200%</option>
      <option value="fit">幅に合わせる</option>
    </select>
    <span id="status">読み込み中...</span>
  </div>
  <div id="viewerContainer"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const PDF_PATH = 'PDF/' + encodeURIComponent('ボトックスビスタ同意説明書 (1).pdf');

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const container  = document.getElementById('viewerContainer');
    const status     = document.getElementById('status');
    const pageInfo   = document.getElementById('pageInfo');
    const zoomSelect = document.getElementById('zoomSelect');

    let pdfDoc = null;
    const canvases = []; // ページ番号(1始まり)対応のcanvas要素

    function getScale(page) {
      if (zoomSelect.value === 'fit') {
        const naturalVP = page.getViewport({ scale: 1 });
        const availWidth = container.clientWidth - 32;
        return availWidth / naturalVP.width;
      }
      return parseFloat(zoomSelect.value);
    }

    async function renderAll() {
      container.innerHTML = '';
      canvases.length = 0;
      status.textContent = `レンダリング中...`;

      for (let i = 1; i <= pdfDoc.numPages; i++) {
        const page     = await pdfDoc.getPage(i);
        const scale    = getScale(page);
        const viewport = page.getViewport({ scale });

        const canvas   = document.createElement('canvas');
        canvas.width   = viewport.width;
        canvas.height  = viewport.height;
        canvas.dataset.page = i;
        canvases.push(canvas);
        container.appendChild(canvas);

        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        status.textContent = `${i} / ${pdfDoc.numPages} ページ読み込み中...`;
      }

      status.textContent = '読み込み完了';
      pageInfo.textContent = `全 ${pdfDoc.numPages} ページ`;
      btnPrev.style.display = 'none';
      btnNext.style.display = 'none';
    }

    // スクロール中に現在ページを更新
    container.addEventListener('scroll', () => {
      const mid = container.scrollTop + container.clientHeight / 2;
      let closest = canvases[0];
      for (const c of canvases) {
        if (c.offsetTop <= mid) closest = c;
      }
      if (closest) pageInfo.textContent = `${closest.dataset.page} / ${pdfDoc.numPages}`;
    }, { passive: true });

    zoomSelect.addEventListener('change', () => renderAll());

    pdfjsLib.getDocument(PDF_PATH).promise.then((pdf) => {
      pdfDoc = pdf;
      renderAll();
    }).catch((err) => {
      status.textContent = 'エラー: ' + err.message;
    });
  </script>
</body>
</html>
