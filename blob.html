<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⑤ Blob URL で表示</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #555; }
    #log {
      padding: 8px 12px; background: #1e1e1e; color: #d4d4d4;
      font-size: 0.78rem; font-family: monospace; line-height: 1.6;
      max-height: 110px; overflow-y: auto;
    }
    #log .ok   { color: #4ec9b0; }
    #log .err  { color: #f48771; }
    #log .info { color: #9cdcfe; }
    #container { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    #container img { max-width: 100%; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
  </style>
</head>
<body>
  <div id="log"></div>
  <div id="container"></div>

  <script>
    const PDFS = ['ボトックスビスタ同意説明書 (1).pdf', '【同意書サンプル】脱毛.doc - Google ドキュメント.pdf'];
    const pdfIdx = parseInt(new URLSearchParams(location.search).get('pdf') || '0');
    const PDF_PATH = 'PDF/' + encodeURIComponent(PDFS[pdfIdx]);

    const logEl     = document.getElementById('log');
    const container = document.getElementById('container');

    function log(msg, cls = 'info') {
      const line = document.createElement('div');
      line.className = cls;
      line.textContent = msg;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    /*
     * ⚠️ モバイルSafari (iOS) の既知バグについて
     *
     * 一般論では URL.createObjectURL(blob) のほうがシンプルで高速とされているが、
     * モバイルSafariでは revokeObjectURL() を呼んでもメモリが完全に解放されない
     * バグが確認されている。
     *
     * 実測例: iPhone 14 Pro (iOS 16.4.1) → 52〜54バッチ後にSafariがクラッシュ
     *         iPhone SE (iOS 15.7.6)     → 30〜32バッチ後にクラッシュ
     *         Object URLを画像として描画するとクラッシュまでの時間が約半分に短縮
     * 参照: https://github.com/shareup/blob-url-memory-leak-demo
     *
     * revokeされたObject URLはページの総メモリサイズに寄与し続けないはずだが、
     * 実際にはそうなっていない。
     * → PDF/画像を繰り返し表示するユースケース（バッチ処理・スライドショー等）では
     *   data URL のほうが安定する場合がある（⑥ data URL タブを参照）。
     */

    (async () => {
      try {
        // ── STEP 1: PDF を fetch して Blob を取得 ──
        log('[Step 1] PDF を fetch 中... ' + PDF_PATH);
        const res = await fetch(PDF_PATH);
        if (!res.ok) throw new Error(`fetch 失敗: ${res.status}`);
        const blob = await res.blob();
        log(`[Step 1] Blob 取得完了 (${blob.size.toLocaleString()} bytes, type: ${blob.type})`, 'ok');

        // ── STEP 2: Blob → Object URL 取得 ──
        const url = URL.createObjectURL(blob);
        log('[Step 2] Object URL 取得完了', 'ok');
        log('[Step 2] URL: ' + url);

        // ── STEP 3: img.src にセット ──
        const img = document.createElement('img');
        img.src = url;
        img.alt = 'PDF';
        container.appendChild(img);
        log('[Step 3] img.src に Object URL をセット', 'ok');

        // img ロード完了後に Object URL を解放してメモリを戻す
        img.addEventListener('load', () => {
          URL.revokeObjectURL(url);
          log('[Cleanup] URL.revokeObjectURL 実行 → Blob メモリ解放', 'ok');
        }, { once: true });

      } catch (err) {
        log('[Error] ' + err.message, 'err');
      }
    })();
  </script>
</body>
</html>
