<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⑥ base64 → data URL で表示</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #555; }
    #log {
      padding: 8px 12px; background: #1e1e1e; color: #d4d4d4;
      font-size: 0.78rem; font-family: monospace; line-height: 1.6;
      max-height: 110px; overflow-y: auto;
    }
    #log .ok   { color: #4ec9b0; }
    #log .err  { color: #f48771; }
    #log .info { color: #9cdcfe; }
    #container { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    #container img { max-width: 100%; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
  </style>
</head>
<body>
  <div id="log"></div>
  <div id="container"></div>

  <script>
    const PDFS = ['ボトックスビスタ同意説明書 (1).pdf', '【同意書サンプル】脱毛.doc - Google ドキュメント.pdf'];
    const pdfIdx = parseInt(new URLSearchParams(location.search).get('pdf') || '0');
    const PDF_PATH = 'PDF/' + encodeURIComponent(PDFS[pdfIdx]);

    const logEl     = document.getElementById('log');
    const container = document.getElementById('container');

    function log(msg, cls = 'info') {
      const line = document.createElement('div');
      line.className = cls;
      line.textContent = msg;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    (async () => {
      try {
        // ── STEP 1: PDF を fetch して Blob を取得 ──
        log('[Step 1] PDF を fetch 中... ' + PDF_PATH);
        const res = await fetch(PDF_PATH);
        if (!res.ok) throw new Error(`fetch 失敗: ${res.status}`);
        const blob = await res.blob();
        log(`[Step 1] Blob 取得完了 (${blob.size.toLocaleString()} bytes, type: ${blob.type})`, 'ok');

        // ── STEP 2: Blob → data URL (FileReader.readAsDataURL) ──
        //
        // ✅ data URL が Blob URL より安定する場合（モバイルSafari）
        //   Blob URL は URL.createObjectURL() がブラウザ側でURLレジストリを管理するため、
        //   revokeObjectURL() を呼んでもモバイルSafariではメモリが完全解放されないバグがある。
        //   iPhone 14 Pro (iOS 16.4.1) で 52〜54バッチ後にクラッシュする事例あり。
        //   参照: https://github.com/shareup/blob-url-memory-leak-demo
        //
        //   data URL は「文字列をそのまま src に渡す」だけで
        //   ブラウザ側のURLレジストリを使わないため、このバグを踏まない。
        //   ただし base64文字列自体のメモリ解放はGC任せになる点に注意。
        log('[Step 2] FileReader で data URL に変換中...');
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload  = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(blob);
        });
        log(`[Step 2] data URL 変換完了 (${dataUrl.length.toLocaleString()} chars)`, 'ok');
        log('[Step 2] data URL (先頭60文字): ' + dataUrl.slice(0, 60) + '...');

        // ── STEP 3: img.src にセット ──
        const img = document.createElement('img');
        img.src = dataUrl;
        img.alt = 'PDF';
        container.appendChild(img);
        log('[Step 3] img.src に data URL をセット', 'ok');

      } catch (err) {
        log('[Error] ' + err.message, 'err');
      }
    })();
  </script>
</body>
</html>
