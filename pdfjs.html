<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>② PDF.js（Canvas）で表示</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #555; }
    #status { padding: 16px; color: #fff; text-align: center; }
    #pages { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px; }
    canvas { max-width: 100%; box-shadow: 0 2px 8px rgba(0,0,0,0.4); background: #fff; }
  </style>
</head>
<body>

  <div id="status">読み込み中...</div>
  <div id="pages"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const PDF_PATH = 'PDF/' + encodeURIComponent('【同意書サンプル】脱毛.doc - Google ドキュメント.pdf');

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const status = document.getElementById('status');
    const pages  = document.getElementById('pages');
    const SCALE  = window.devicePixelRatio >= 2 ? 1.5 : 2; // Retina対応

    pdfjsLib.getDocument(PDF_PATH).promise.then(async (pdf) => {
      status.textContent = `全 ${pdf.numPages} ページ`;

      for (let i = 1; i <= pdf.numPages; i++) {
        const page     = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: SCALE });

        const canvas  = document.createElement('canvas');
        canvas.width  = viewport.width;
        canvas.height = viewport.height;
        canvas.style.width  = (viewport.width / SCALE) + 'px';
        canvas.style.height = (viewport.height / SCALE) + 'px';
        pages.appendChild(canvas);

        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      }
    }).catch((err) => {
      status.textContent = 'エラー: ' + err.message;
    });
  </script>
</body>
</html>
