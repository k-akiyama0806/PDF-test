<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF表示テスト（iOS確認用）</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; display: flex; flex-direction: column; height: 100dvh; font-family: sans-serif; }

    #tabs {
      display: flex; overflow-x: auto; background: #f5f5f5;
      border-bottom: 2px solid #ddd;
      flex-shrink: 0; -webkit-overflow-scrolling: touch;
    }
    #tabs button {
      flex-shrink: 0; padding: 10px 14px; border: none; background: transparent;
      color: #555; font-size: 0.85rem; cursor: pointer; border-bottom: 3px solid transparent;
      white-space: nowrap; margin-bottom: -2px;
    }
    #tabs button.active { color: #0078d4; border-bottom-color: #0078d4; font-weight: bold; }
    #tabs button:hover:not(.active) { color: #333; background: #eaeaea; }

    #frames { flex: 1; position: relative; }
    #frames iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: none; display: none;
    }
    #frames iframe.active { display: block; }
  </style>
</head>
<body>
  <div id="tabs">
    <button class="active" data-target="f-iframe">① iframe</button>
    <button data-target="f-pdfjs">② PDF.js Canvas</button>
    <button data-target="f-image">③ img変換</button>
    <button data-target="f-viewer">④ PDF.js規定ビューワー</button>
  </div>
  <div id="frames">
    <iframe id="f-iframe"  src="iframe.html"  class="active"></iframe>
    <iframe id="f-pdfjs"   src=""             data-src="pdfjs.html"></iframe>
    <iframe id="f-image"   src=""             data-src="image.html"></iframe>
    <iframe id="f-viewer"  src=""             data-src="viewer.html"></iframe>
  </div>

  <script>
    const tabs   = document.querySelectorAll('#tabs button');
    const frames = document.querySelectorAll('#frames iframe');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const targetId = tab.dataset.target;

        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        frames.forEach(f => {
          f.classList.remove('active');
          if (f.id === targetId) {
            // 初回タブ切り替え時にだけ src をセット（遅延読み込み）
            if (!f.src || f.src === window.location.href) {
              f.src = f.dataset.src;
            }
            f.classList.add('active');
          }
        });
      });
    });
  </script>
</body>
</html>
