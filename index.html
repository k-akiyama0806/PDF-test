<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF表示テスト（iOS確認用）</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; display: flex; flex-direction: column; height: 100dvh; font-family: sans-serif; }

    #tabs {
      display: flex; overflow-x: auto; background: #f5f5f5;
      border-bottom: 2px solid #ddd;
      flex-shrink: 0; -webkit-overflow-scrolling: touch;
    }
    #tabs button {
      flex-shrink: 0; padding: 10px 14px; border: none; background: transparent;
      color: #555; font-size: 0.85rem; cursor: pointer; border-bottom: 3px solid transparent;
      white-space: nowrap; margin-bottom: -2px;
    }
    #tabs button.active { color: #0078d4; border-bottom-color: #0078d4; font-weight: bold; }
    #tabs button:hover:not(.active) { color: #333; background: #eaeaea; }

    #frames { flex: 1; position: relative; }
    #frames iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: none; display: none;
    }
    #frames iframe.active { display: block; }

    #carousel {
      display: flex; align-items: center; justify-content: center;
      padding: 4px 12px; background: #eaeaea; border-bottom: 1px solid #ddd;
      flex-shrink: 0;
    }
    #pdf-name { font-size: 0.85rem; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      z-index: 10; border: none; background: rgba(0,0,0,0.35); color: #fff;
      width: 36px; height: 36px; border-radius: 50%;
      font-size: 1.4rem; cursor: pointer; line-height: 1;
    }
    #btn-prev { left: 6px; }
    #btn-next { right: 6px; }
  </style>
</head>
<body>
  <div id="tabs">
    <button class="active" data-target="f-iframe">① iframe</button>
    <button data-target="f-pdfjs">② PDF.js Canvas</button>
    <button data-target="f-image">③ img変換</button>
    <button data-target="f-viewer">④ PDF.js規定ビューワー</button>
    <button data-target="f-blob">⑤ base64→Blob URL</button>
    <button data-target="f-dataurl">⑥ base64→data URL</button>
  </div>
  <div id="carousel">
    <span id="pdf-name"></span>
  </div>
  <div id="frames">
    <button id="btn-prev" class="nav-btn">&#8249;</button>
    <button id="btn-next" class="nav-btn">&#8250;</button>
    <iframe id="f-iframe"  src="" class="active"></iframe>
    <iframe id="f-pdfjs"   src=""></iframe>
    <iframe id="f-image"   src=""></iframe>
    <iframe id="f-viewer"  src=""></iframe>
    <iframe id="f-blob"    src=""></iframe>
    <iframe id="f-dataurl" src=""></iframe>
  </div>

  <script>
    const tabs   = document.querySelectorAll('#tabs button');
    const frames = document.querySelectorAll('#frames iframe');
    const BASES  = ['iframe.html', 'pdfjs.html', 'image.html', 'viewer.html', 'blob.html', 'dataurl.html'];
    const PDFS   = ['ボトックスビスタ同意説明書 (1)', '【同意書サンプル】脱毛'];
    let pdfIndex = 0;

    const pdfNameEl = document.getElementById('pdf-name');

    function pdfSrc(base) {
      return base + '?pdf=' + pdfIndex;
    }

    function updatePdf() {
      pdfNameEl.textContent = PDFS[pdfIndex];
      frames.forEach((f, i) => {
        if (f.classList.contains('active')) {
          f.src = pdfSrc(BASES[i]);
        } else {
          f.src = ''; // 非アクティブはリセット（次回タブ切替時に再読込）
        }
      });
    }

    document.getElementById('btn-prev').addEventListener('click', () => {
      pdfIndex = (pdfIndex - 1 + PDFS.length) % PDFS.length;
      updatePdf();
    });
    document.getElementById('btn-next').addEventListener('click', () => {
      pdfIndex = (pdfIndex + 1) % PDFS.length;
      updatePdf();
    });

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const targetId = tab.dataset.target;
        tabs.forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        frames.forEach((f, i) => {
          f.classList.remove('active');
          if (f.id === targetId) {
            if (!f.src || f.src === window.location.href) {
              f.src = pdfSrc(BASES[i]);
            }
            f.classList.add('active');
          }
        });
      });
    });

    // 初期化
    updatePdf();
  </script>
</body>
</html>
